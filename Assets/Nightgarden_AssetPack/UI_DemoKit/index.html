<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜园 · UI 素材预览</title>
<style>body{margin:0;background:#151e1b;color:#f5e5bf;font:16px 'Microsoft YaHei',sans-serif}header,section{max-width:1500px;margin:22px auto;padding:0 20px}h1{font-size:25px}p{color:#b6ba9c}nav{display:flex;gap:8px;flex-wrap:wrap}button,a{background:#344933;color:#f5e5bf;border:1px solid #93aa69;border-radius:9px;padding:10px 16px;cursor:pointer;text-decoration:none}button:hover,button.active{background:#657f48}button:active{transform:translateY(1px)}#screen{width:100%;height:auto;border-radius:16px;display:block}#stage{position:relative}#hit{background:#28352d;border:1px solid #627353;border-radius:16px;width:260px;height:220px}.row{display:flex;align-items:center;gap:20px;flex-wrap:wrap}small{color:#b6ba9c}#message{min-height:25px;color:#efb456}#stage .hotspot{position:absolute;background:transparent;border:0;border-radius:10px;padding:0;}#stage .hotspot:hover{background:#ffffff16;box-shadow:0 0 0 2px #efb456;}#stage .hotspot:focus-visible{outline:3px solid #efb456;outline-offset:3px}</style>
<header><h1>夜园守卫 · Demo UI 素材预览</h1><p>15 张界面模板，配套独立组件与图标。此页是素材浏览器，数值及解锁条件为示例。</p><nav id="nav"></nav></header>
<section><div id="stage"><img id="screen" alt="界面预览"><button id="loginSubmit" class="hotspot" aria-label="预览登录后进入主界面" style="left:57.5%;top:59%;width:32.8125%;height:6.7778%" hidden></button><button id="openRegister" class="hotspot" aria-label="注册新账号" style="left:65.125%;top:76%;width:17.5%;height:6%" hidden></button><button id="registerSubmit" class="hotspot" aria-label="预览注册后返回登录" style="left:57.5%;top:67.6667%;width:32.8125%;height:6.7778%" hidden></button><button id="backLogin" class="hotspot" aria-label="返回登录" style="left:65.125%;top:78.8889%;width:17.5%;height:6%" hidden></button><button id="rankEntry" class="hotspot" aria-label="进入排行榜" style="left:6.625%;top:57.111%;width:21.25%;height:6%" hidden></button><button id="rankBack" class="hotspot" aria-label="返回主界面" style="left:4.0625%;top:91.444%;width:16.25%;height:6%" hidden></button></div><p id="message"></p><div class="row"><button id="prev">上一页</button><button id="next">下一页</button><a href="README.md">查看接入说明</a><a href="Data/demo_config.json">查看示例配置</a></div></section>
<section><h2>受击反馈与音效</h2><div class="row"><canvas id="hit" width="520" height="440"></canvas><div><button id="playHit">播放受击动画</button><p>四帧，12 FPS，单次播放，结束后清空。</p><nav id="sounds"></nav></div></div><p>受击可搭配已有 damage_splat / hit_sparks 粒子；怪物死亡使用 enemy_death。</p></section>
<script>
const pages=['01_main_menu','02_characters','03_starting_weapon','04_shop','05_refresh','06_combine','07_level_up','08_hit_and_drops','09_leaderboard','10_login','11_register','12_battle_hud','13_pause','14_defeat','15_victory'];
const labels=['主菜单','选择角色','初始武器','商店','刷新确认','合成升级','属性升级','受击与掉落','排行榜','账号登录','注册账号','战斗界面','暂停','失败结算','胜利结算'];
const soundIds=['05_click','06_hover','07_deny','02_coin','04_level','10_hit','11_hurt'];
const soundLabels=['点击','悬停','不可用','购买 / 拾取','合成 / 升级','命中','受伤'];
const sounds=Object.fromEntries(soundIds.map(id=>[id,new Audio('Audio/'+id+'.wav')]));
function play(id){const a=sounds[id];a.currentTime=0;a.volume=.3;a.play().catch(()=>{});}
let selected=0;
function show(i,withSound=true){selected=(i+pages.length)%pages.length;document.getElementById('screen').src='Screens/'+pages[selected]+'.png';document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('active',j===selected));document.getElementById('rankEntry').hidden=selected!==0;document.getElementById('rankBack').hidden=selected!==8;for(const id of ['loginSubmit','openRegister'])document.getElementById(id).hidden=selected!==9;for(const id of ['registerSubmit','backLogin'])document.getElementById(id).hidden=selected!==10;updateDemoLinks();if(withSound)play('05_click');document.getElementById('message').textContent=labels[selected]+' · 1600 × 900 模板；文字和价格在游戏中单独叠加。';}
labels.forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>show(i);document.getElementById('nav').appendChild(b);});
soundIds.forEach((id,i)=>{const b=document.createElement('button');b.textContent=soundLabels[i];b.onclick=()=>play(id);document.getElementById('sounds').appendChild(b);});
document.getElementById('prev').onclick=()=>show(selected-1);document.getElementById('next').onclick=()=>show(selected+1);
const sheet=new Image();sheet.src='Art/hit.png';const canvas=document.getElementById('hit'),ctx=canvas.getContext('2d');let request;
document.getElementById('playHit').onclick=()=>{if(!sheet.complete||!sheet.naturalWidth)return;cancelAnimationFrame(request);const start=performance.now();play('11_hurt');function frame(now){ctx.clearRect(0,0,520,440);const i=Math.floor((now-start)/1000*12);if(i>=4)return;ctx.drawImage(sheet,i%2*768,Math.floor(i/2)*512,768,512,10,53,500,333);request=requestAnimationFrame(frame);}request=requestAnimationFrame(frame);};
document.getElementById('rankEntry').onclick=()=>show(8);
document.getElementById('rankBack').onclick=()=>show(0);
document.getElementById('loginSubmit').onclick=()=>show(0);
document.getElementById('openRegister').onclick=()=>show(10);
document.getElementById('registerSubmit').onclick=()=>{show(9);document.getElementById('message').textContent='注册流程预览：返回登录。本页未创建账号，也不收集或保存密码。';};
document.getElementById('backLogin').onclick=()=>show(9);

const flowDefinitions=[
 [0,'进入游戏',106,435,340,54,1],[1,'选择初始武器',1207,794,320,54,2],[2,'进入战斗',1190,795,335,54,11],
 [11,'暂停游戏',1480,28,80,72,12],[12,'继续游戏',590,372,420,54,11],[12,'重新开始',590,461,420,54,2],[12,'返回主界面',590,550,420,54,0],
 [13,'再来一局',330,630,285,54,2],[13,'查看排行榜',657,630,285,54,8],[13,'返回主界面',984,630,285,54,0],
 [14,'再来一局',330,630,285,54,2],[14,'查看排行榜',657,630,285,54,8],[14,'返回主界面',984,630,285,54,0],
 [3,'进入下一波',1234,844,301,43,11]
];
const flowLinks=flowDefinitions.map(([page,label,x,y,w,h,target])=>{const b=document.createElement('button');b.className='hotspot';b.ariaLabel=label;b.style.cssText=`left:${x/16}%;top:${y/9}%;width:${w/16}%;height:${h/9}%`;b.onclick=()=>show(target);document.getElementById('stage').appendChild(b);return {page,b};});
function updateDemoLinks(){for(const {page,b} of flowLinks)b.hidden=selected!==page;}

show(9,false);
</script></html>
